<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>万劫闲仙·清泉岁月</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Noto Serif SC","Source Han Serif CN",serif;background:#e8e4d4;color:#3e3a30;line-height:1.9;min-height:100vh;font-size:17px}
.w{max-width:520px;margin:0 auto;padding:24px 18px}
.panel{background:linear-gradient(135deg,#f5f1e3,#ede8d6);border:1px solid #c4b898;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.panel-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cname{font-size:22px;color:#8a6a10;font-weight:600;letter-spacing:3px}
.ctitle{font-size:13px;color:#9a8c70;background:#f0ead6;border:1px solid #c4b898;border-radius:4px;padding:3px 12px}
.pday{font-size:14px;color:#7a7060;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #d4ccb8}
.pday b{color:#a87a20;font-size:17px}
.zhong{display:inline-block;width:22px;height:22px;border-radius:50%;border:1.5px solid #bbb;text-align:center;font-size:12px;color:#8a8070;line-height:20px;margin-left:8px;vertical-align:middle;transition:.3s}
.zhong.p{border-color:#a87a20;color:#a87a20;animation:pl 2s infinite}
.zhong.a{border-color:#c04428;color:#c04428;background:#fde8e0;animation:pl 1s infinite}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.paths{margin-bottom:12px}
.pr{display:flex;align-items:center;gap:8px;margin:5px 0}
.pn{width:36px;font-size:14px;color:#5a5238;flex-shrink:0}
.pb{flex:1;height:10px;background:#d8d2c2;border-radius:5px;overflow:hidden;position:relative}
.pf{height:100%;border-radius:5px;transition:width .6s ease;position:relative}
.pf::after{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:rgba(255,255,255,.2);border-radius:5px 5px 0 0}
.pl{width:76px;font-size:12px;color:#8a8070;text-align:right;flex-shrink:0}
.jrow{display:flex;align-items:center;gap:6px;margin-bottom:8px;padding-top:10px;border-top:1px solid #d4ccb8;flex-wrap:wrap}
.jlabel{font-size:13px;color:#7a7060;margin-right:4px}
.jdot{width:14px;height:14px;border-radius:50%;border:2px solid #c4b898;transition:.3s;flex-shrink:0}
.jdot.done{background:#a87a20;border-color:#a87a20}
.jdot.active{background:#c04428;border-color:#c04428;animation:pl 1s infinite}
.vrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.vi{font-size:12px;color:#7a7060;background:#f0ead6;border:1px solid #d4ccb8;border-radius:4px;padding:2px 8px}
.sb{margin-bottom:16px;min-height:100px}
.st2{font-size:18px;line-height:2.1;letter-spacing:.5px;color:#3e3a30}
.st2 p{margin-bottom:10px;opacity:0;animation:fi .5s forwards}
@keyframes fi{to{opacity:1}}
.hi{color:#a87a20}.wr{color:#c04428}.wm{color:#4a8040}.gm{color:#7a7060;font-size:15px}
.ptag{display:inline-block;font-size:13px;color:#9a8c70;border:1px solid #d4ccb8;border-radius:4px;padding:2px 12px;margin-bottom:8px;background:#f5f1e3}
.cb{margin-top:12px}
.bc{display:block;width:100%;padding:14px 18px;margin-bottom:10px;background:#f4f0e6;border:1px solid #c4b898;border-radius:8px;color:#3e3a30;font-family:inherit;font-size:17px;text-align:left;cursor:pointer;transition:.2s;line-height:1.6}
.bc:hover{border-color:#a87a20;color:#a87a20;background:#efe6d4;transform:translateX(4px)}
.bc .su{font-size:14px;color:#8a8070;margin-top:3px}
.bc:hover .su{color:#a87a20}
.nb{position:fixed;top:24px;left:50%;transform:translateX(-50%);background:#f4f0e6;border:1px solid #a87a20;border-radius:8px;padding:12px 24px;font-size:15px;color:#a87a20;z-index:100;animation:ni .3s forwards,no .3s 2.5s forwards;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.1)}
@keyframes ni{from{opacity:0;top:10px}to{opacity:1;top:24px}}
@keyframes no{to{opacity:0;top:10px}}
.bb{display:flex;justify-content:center;gap:14px;padding:12px 0;border-top:1px solid #c4b898;margin-top:8px}
.btn{font-size:15px;color:#7a7060;background:#f4f0e6;border:1px solid #c4b898;border-radius:4px;padding:6px 16px;cursor:pointer;font-family:inherit;transition:.2s}
.btn:hover{border-color:#a87a20;color:#a87a20}
.ts{position:relative;overflow:hidden;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0}
.ts-bg{position:absolute;top:0;left:0;right:0;bottom:0;z-index:0}
.ts-content{position:relative;z-index:1;width:100%;max-width:460px;padding:0 20px;text-align:center}
.bell-wrap{margin-bottom:16px;display:flex;justify-content:center}
.bell-svg{width:110px;height:158px;animation:bellGlow 3s ease-in-out infinite}
@keyframes bellGlow{0%,100%{filter:drop-shadow(0 0 8px rgba(232,200,96,.15))}50%{filter:drop-shadow(0 0 18px rgba(232,200,96,.32))}}
.ts-sub2{font-size:15px;color:#b8a878;line-height:2.4;letter-spacing:2px;margin-bottom:20px;opacity:.85}
.ts-sub2 .sub-line{display:block}
.ts .title-wrap{margin-bottom:6px}
.ts h1{font-size:44px;color:#e8c860;font-weight:700;letter-spacing:12px;text-indent:12px;text-shadow:0 0 20px rgba(232,200,96,.25),0 2px 8px rgba(0,0,0,.3);margin-bottom:2px}
.ts .ts-sub{font-size:16px;color:#a89870;letter-spacing:8px;text-indent:8px;margin-bottom:20px;opacity:.8}
.ts .ts-divider{width:60%;height:1px;background:linear-gradient(90deg,transparent,rgba(232,168,32,.4),transparent);margin:0 auto 24px}
.ts .ts-tags{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:28px}
.ts .ts-tag{font-size:14px;color:#c4b890;border:1px solid rgba(168,140,80,.3);border-radius:20px;padding:5px 16px;background:rgba(40,36,28,.3);backdrop-filter:blur(2px);letter-spacing:1px}
.ts .btn-wrap{display:flex;justify-content:center;align-items:center;flex-direction:column;gap:14px}
.sb2{padding:18px 56px;background:linear-gradient(135deg,#3a3328,#2a2418);border:1px solid #c0922a;border-radius:10px;color:#e8c860;font-size:20px;font-family:inherit;cursor:pointer;letter-spacing:6px;text-indent:6px;transition:.3s;box-shadow:0 4px 20px rgba(192,146,42,.15)}
.sb2:hover{background:linear-gradient(135deg,#4a3d2e,#3a3120);border-color:#e8a830;color:#ffd840;box-shadow:0 6px 28px rgba(232,168,48,.25);transform:translateY(-2px)}
.lb{padding:10px 28px;background:transparent;border:1px solid rgba(168,140,80,.3);border-radius:8px;color:#a89870;font-size:14px;font-family:inherit;cursor:pointer;transition:.2s}
.lb:hover{border-color:rgba(232,168,32,.5);color:#c4b890}
.ts .ts-hint{margin-top:24px;font-size:13px;color:#6a6258;opacity:.6}
.es{text-align:center;padding:40px 20px}
.es .et{font-size:14px;color:#7a7060;border:1px solid #c4b898;border-radius:4px;padding:5px 14px;margin-bottom:20px;display:inline-block}
.es .rb{padding:14px 36px;background:#f4f0e6;border:1px solid #a87a20;border-radius:8px;color:#a87a20;font-size:16px;font-family:inherit;cursor:pointer;transition:.2s;margin-top:30px}
.es .rb:hover{background:#efe6d4;color:#c09020}
.hd{display:none}
@media(max-width:400px){.w{padding:16px 12px}.bc{padding:12px 14px;font-size:16px}.st2{font-size:16px}.cname{font-size:20px}.pn{width:32px}.pl{width:64px;font-size:11px}.jdot{width:12px;height:12px}}
</style>
</head>

<script>
// ========== 常量 ==========
var LV = ['凡品初段','凡品中段','凡品后段','灵品初段','灵品中段','灵品后段','圣品初段','圣品中段','圣品后段','神品'];
var JN = ['力径','气径','魂径','器径','阵径','劫径'];
var JC = ['#80b040','#50b890','#a0a0d0','#e09070','#70a8d0','#d0a020'];
var VN = ['水渠','灵果','食物','好感'];
var SS = {1:'初到',3:'三载',10:'十载',25:'廿五载',50:'半百',60:'一甲子',70:'七十载',85:'近百年',91:'百载',110:'百一十载',130:'两甲子',150:'第二甲子',170:'百七十载',180:'百八十载',200:'两百载',220:'两百廿载',240:'近三甲子',260:'两百六十载',280:'第三甲子',300:'三百载',320:'三百廿载',340:'三百四十载',360:'近四甲子',380:'三百八十载',400:'四百载'};
var DR = [3,7,3,3,5,5,7,4,3];
var NM = ['天雷劫','心魔劫','血噬劫','地裂劫','虚空劫','业火劫','天命劫','轮回劫','飞升劫'];
var TITLES = ['废骨之人','雷骨初成','心壁已成','血脉净化','心壁透光','灵脉重连','业火净体','天命觉醒','轮回通透','闲仙'];

// ========== 状态 ==========
var G;
var dayPhase = 0;
function initState() {
  return {day:1,j:[0,0,0,0,0,0],v:[0,30,30,50],jie:[0,0,0,0,0,0,0,0,0],cj:null,jd:0,xz:0,ev:[],prevLv:[0,0,0,0,0,0]};
}

// ========== 工具 ==========
function sn() {
  var s = '初到';
  for (var d in SS) { if (G.day >= Number(d)) s = SS[d]; }
  return s;
}
function getTitle() {
  var s = 0;
  for (var i = 0; i < 9; i++) s += G.jie[i];
  return TITLES[Math.min(s,9)];
}
function jieSum() {
  var s = 0;
  for (var i = 0; i < 9; i++) s += G.jie[i];
  return s;
}
function pathSum() {
  return G.j[0]+G.j[1]+G.j[2]+G.j[3]+G.j[4]+G.j[5];
}
function chkLoad() {
  if (localStorage.getItem('wjxx2')) document.getElementById('loadBtn').style.display = 'inline-block';
}
function show(id) { document.getElementById(id).classList.remove('hd'); }
function hide(id) { document.getElementById(id).classList.add('hd'); }

// ========== 入口 ==========
function newGame() {
  G = initState();
  hide('titleScreen'); show('gameScreen'); opening();
}
function loadGame() {
  var s = localStorage.getItem('wjxx2');
  if (s) {
    G = JSON.parse(s);
    while (G.jie.length < 9) G.jie.push(0);
    G.prevLv = G.prevLv || [0,0,0,0,0,0];
    hide('titleScreen'); hide('endScreen'); show('gameScreen');
    chkLvNotify(); day(); notify('读档了');
  } else { notify('没有存档'); }
}
function saveGame() { localStorage.setItem('wjxx2',JSON.stringify(G)); notify('存档了'); }
function delSave() { localStorage.removeItem('wjxx2'); notify('删档了'); chkLoad(); }

// ========== 序幕 ==========
function opening() {
  story([
    '秦荒觉得自己大概是死了。',
    '天渊宗长老说过——万劫钟要醒，得过一场大劫。他当时没当回事。',
    '裂隙深渊里没有光。掉了多久——不知道。可能一天。可能一年。',
    '但心脏在跳。',

    // 6 业火

    // 7 天命
    ['钟响了。第七个凹槽<span class="hi">\u201C天命\u201D</span>亮了。','<span class="wr">第七劫·天命劫。</span>','天命不是命令——是问题。','\u201C你要拿力量做什么？\u201D','七载。不疼。但比疼难。','答案不是话。是日子。是田。是茶。是水渠。是村子。','<span class="hi">天命觉醒。</span>答案不是做大事——是做好小事。','前世记忆：初代修仙者。不是要成仙——是种地种出来的。种着种着就修了。修了也不知道。'],

}
function jieDay() {
  G.jd++;
  var left = DR[G.cj] - G.jd;
  if (left <= 0) {
    G.jie[G.cj] = 1;
    G.j[0] += 2; G.j[2] += 2; G.j[5] += 1;
    if (G.cj === 2) { G.j[4] += 3; G.j[1] += 1; }
    if (G.cj === 3) { G.j[5] += 1; G.j[4] += 1; notify('劫径·灵品初段 — 能提前三载感知劫钟预震'); }
    if (G.cj === 4) { G.j[5] += 2; G.j[4] += 2; G.j[2] += 1; notify('灵脉重连 — 阵径+劫径大幅提升'); }
    if (G.cj === 5) { G.j[0] += 1; G.j[2] += 1; notify('业火净体 — 全身业障焚尽'); }
    if (G.cj === 6) { G.j[5] += 1; G.j[0] += 1; notify('天命觉醒 — 答案不是话，是日子'); }
    if (G.cj === 7) { G.j[4] += 1; G.j[5] += 1; notify('轮回通透 — 看见轮子了'); }
    if (G.cj === 8) { G.j[5] += 2; G.j[4] += 1; G.j[2] += 1; notify('万劫已渡 — 飞升劫渡完'); }
    G.cj = null; G.jd = 0;
    if (G.jie[8] >= 1) { ninthEnding(); return; }
    notify('劫已渡');
    story(['劫过了。','端起茶杯喝了一口。','<span class="wm">继续喝茶。</span>'], function(){ chkLvNotify(); day(); });
    return;
  }
  var dt = [
    '天雷灌体。第'+G.jd+'载。扛着。疼。但没断。还剩'+left+'载。',
    '心魔幻境。第'+G.jd+'载。遗憾、愤怒、恐惧被放大。还剩'+left+'载。',
    '灵血自噬。第'+G.jd+'载。雷骨被围，心壁被啃。还剩'+left+'载。',
    '地裂入骨。第'+G.jd+'载。荒骨从脚底裂——心壁薄了但没穿。还剩'+left+'载。',
    '虚空断脉。第'+G.jd+'载。完界碎片灵气断了——心壁散了再聚。还剩'+left+'载。',
    '业火焚身。第'+G.jd+'载。前世的业从骨头里烧出来——重的烧掉了。还剩'+left+'载。',
    '天命叩问。第'+G.jd+'载。不是疼——是问。答案不是话。是日子。还剩'+left+'载。',
    '轮回流转。第'+G.jd+'载。看着轮子转。每一世都是同一个人。还剩'+left+'载。',
    '飞升化形。第'+G.jd+'载。光灌进身体——装不下。碎了。在变。还剩'+left+'载。'
  ];
  story([dt[G.cj]], function(){
    choices([{text:'继续扛', sub:'还剩'+left+'载', cb:function(){jieDay()}}]);
  });
}

// ========== 第九劫后·终局选择 ==========
function ninthEnding() {
  story([
    '九劫渡完了。',
    '万劫钟九个凹槽全亮了。钟没再响。不会再响了。',
    '灰天——亮了。不是裂隙的光。是天本身。',
    '光从天上落下来。',
    '秦荒站在光里。',
    '宋婶从厨房探出头：\u201C秦荒？吃饭了。灵果红烧肉。\u201D'
  ], function() {
    choices([
      {text:'飞升 — 天门已开', sub:'九劫刑完始得仙', cb:function(){ending('飞升')}},
      {text:'留下 — 种地喝茶修水渠', sub:'凡心', cb:function(){ending('凡心')}}
    ]);
  });
}

// ========== 等级通知 ==========
function chkLvNotify() {
  for (var i = 0; i < 6; i++) {
    var now = Math.floor(G.j[i]);
    var prev = Math.floor(G.prevLv[i] || 0);
    if (now > prev && now <= 9) notify(JN[i] + '·' + LV[now]);
  }
  G.prevLv = G.j.slice();
}

// ========== 结局 ==========

    '沉沦': ['<span class="et">沉沦·裂隙</span>','劫扛不过。灵血枯竭。变成干壳。','但裂隙里还有光。万劫钟还在。钟不灭说明劫还没完。','<span class="gm">不是终点。是另一条路的起点。</span>'],
    '扎根2': ['<span class="et">扎根·第二甲子</span>','第二甲子也过了。','冬灵草扛过了冬。小麦收了两茬。稳纹刻了两个。裂隙扩张减了百分之四十。','域府巡查使走了——\u201C你的稳纹有效。域府记录了。\u201D','四劫渡了。力径圣品初段。魂径灵品后段。劫径灵品初段。','灰天黄昏透出的光——从一片白变成一片半白。','<span class="wm">第二甲子过了。扎根深了。</span>'],
    '出山2': ['<span class="et">出山·完界碎片</span>','第四劫渡了。心壁透光——看见了裂隙里的完界碎片。','碎片没死。灵气还在流。光还在。','秦荒站起来了。不是想变强——是想去看。','宋老根在村口看他走。\u201C麦子我帮你看着。\u201D','秦荒走了。裂隙方向——完界碎片方向。','灰天黄昏透出的光——从一片半白变成两片白。'],
    '闲仙2': ['<span class="et">闲仙·第二甲子</span>','四劫渡了。六径四条灵品以上。','没出山。没碾压任何人。','域府的报告——清泉村两甲子灵气涨十倍。稳纹减缓裂隙扩张百分之四十。','域府的人来的时候他在老槐树下喝茶。','\u201C你的稳纹怎么刻的？\u201D\u201C种地种出来的。\u201D','报告上又写了：<span class="hi">闲仙</span>。一个闲着的仙。种地喝茶修水渠。不知不觉比所有人都强。'],
    '扎根3': ['<span class="et">扎根·第三甲子</span>','第三甲子也过了。','六劫渡了。冬灵草育了种。稳纹推广了全域。裂隙在自愈——不是停，是在缩。','三百亩不够了——扩了五十亩。五户新人家也种了。','域府的报告：清泉村三甲子灵气涨三十倍。裂隙自愈速度——每年缩半里。','六劫渡了。力径圣品中段。魂径圣品初段。劫径圣品初段。','灰天——亮了一层。不是裂隙的光。是天本身。','<span class="wm">第三甲子过了。扎根更深了。</span>'],
    '出山3': ['<span class="et">出山·第三甲子</span>','六劫渡了。裂隙在自愈。完界碎片在回流。','秦荒站起来了。不是想变强——是想去看。','裂隙在缩。完界碎片在自愈。灵气在回流。','想去看看——完界碎片里还有什么。裂隙通向哪里。','宋老根在村口看他走。\u201C麦子我帮你看着。五户人家也看着。\u201D','秦荒走了。裂隙方向——完界碎片方向。','灰天——亮了一层。天本身在变亮。'],
    '闲仙3': ['<span class="et">闲仙·第三甲子</span>','六劫渡了。六径五条圣品以上。','没出山。没碾压任何人。','域府推广稳纹法——全域学习。裂隙自愈。完界碎片回流。','三百亩扩了五十亩。五户新人家也种了。小豆子灵根觉醒了。','域府的人来的时候他在老槐树下喝茶。','\u201C你的稳纹怎么刻的？\u201D\u201C种地种出来的。\u201D','报告上又写了：<span class="hi">闲仙</span>。一个闲着的仙。三甲子。种地喝茶修水渠。裂隙自愈了。完界碎片回流了。不知不觉——把裂隙修好了。'],
    '飞升': ['<span class="et">飞升</span>','九劫渡完了。万劫钟九个凹槽全亮了。钟没再响。','天开了。光从天上落下来。','秦荒看了一眼清泉村。三百亩田。水渠。老槐树。宋婶的厨房。','他走了。光是暖的。','飞升了。','但飞升之前他做了一件事——把万劫钟留在了清泉村。','钟不响了。但钟在。','后来清泉村的孩子们说——老槐树下有一口钟。不响。但摸一下，灵气会顺着手流进身体。','他们不知道钟是谁留的。','只知道——种地的时候灵气厚，喝茶的时候脑子清，修水渠的时候阵纹顺。','<span class="hi">九劫刑完始得仙。</span>'],
    '凡心': ['<span class="et">凡心</span>','\u201C天门开了？那也得先把麦子收了。\u201D','秦荒没走。','光散了。灰天还是灰天——但比之前亮了一点。不多。但多了。','九劫渡完了。没飞升。','万劫钟留在了身体里。九个凹槽全亮着。不响了。','秦荒继续种地。喝茶。修水渠。','近四甲子秋收比三甲子多了一茬。','宋婶做了灵果红烧肉。酱汁浓到挂壁。土豆炖烂了。','秦荒吃了三碗。','后来域府的报告上写了一个词：<span class="hi">凡心</span>。','不是封号。是描述。一个渡了九劫没飞升的人。','报告旁边批了一行小字：','\u201C此人不可估量。\u201D']
  };
  var t = texts[type] || texts['扎根'];
  t.forEach(function(s) {
    if (s.indexOf('<span') === 0) el.innerHTML += s;
    else { var p = document.createElement('p'); p.className = 'st2'; p.innerHTML = proc(s); el.appendChild(p); }
  });
  var btn = document.createElement('button');
  btn.className = 'rb'; btn.textContent = '重新种地';
  btn.onclick = function() { hide('endScreen'); show('titleScreen'); chkLoad(); };
  el.appendChild(btn);
}

// ========== 渲染 ==========
function proc(s) { return s.replace(/\n/g, '<br>'); }
function story(texts, cb) {
  var b = document.getElementById('storyB');
  b.innerHTML = '';
  texts.forEach(function(t, i) {
    if (t === '') { b.appendChild(document.createElement('br')); return; }
    var p = document.createElement('p');
    p.className = 'st2';
    p.innerHTML = proc(t);
    p.style.animationDelay = (.2 + i * .12) + 's';
    b.appendChild(p);
  });
  if (cb) setTimeout(cb, Math.min(texts.length * 130 + 700, 2800));
}
function choices(opts) {
  var b = document.getElementById('choiceB');
  b.innerHTML = '';
  opts.forEach(function(o) {
    var btn = document.createElement('button');
    btn.className = 'bc';
    btn.innerHTML = o.text + (o.sub ? '<div class="su">' + o.sub + '</div>' : '');
    btn.onclick = function() { o.cb(); };
    b.appendChild(btn);
  });
}
function notify(msg) {
  var n = document.createElement('div');
  n.className = 'nb'; n.textContent = msg;
  document.body.appendChild(n);
  setTimeout(function() { n.remove(); }, 3000);
}

// ========== UI更新 ==========
function updateUI() {
  document.getElementById('dayN').textContent = G.day;
  document.getElementById('seasonT').textContent = sn();
  document.getElementById('charTitle').textContent = getTitle();
  var zi = document.getElementById('zhongI');
  var js = jieSum();
  if (G.cj !== null) zi.className = 'zhong a';
  else if (js < 9) zi.className = 'zhong p';
  else zi.className = 'zhong';
  // 六径
  var paths = document.getElementById('paths');
  paths.innerHTML = '';
  for (var i = 0; i < 6; i++) {
    var pct = Math.min(G.j[i] / 9 * 100, 100);
    var lvl = LV[Math.min(Math.floor(G.j[i]), 9)];
    paths.innerHTML += '<div class="pr"><span class="pn">' + JN[i] + '</span><div class="pb"><div class="pf" style="width:' + pct + '%;background:' + JC[i] + '"></div></div><span class="pl">' + lvl + '</span></div>';
  }
  // 劫钟点 (9个)
  var jrow = document.getElementById('jieRow');
  jrow.innerHTML = '<span class="jlabel">劫钟</span>';
  for (var j = 0; j < 9; j++) {
    var cls = 'jdot';
    if (G.jie[j] >= 1) cls += ' done';
    if (G.cj === j) cls += ' active';
    jrow.innerHTML += '<span class="' + cls + '"></span>';
  }
  // 村子
  var vrow = document.getElementById('villRow');
  vrow.innerHTML = '';
  for (var k = 0; k < 4; k++) {
    var val = Math.min(G.v[k], 100);
    vrow.innerHTML += '<span class="vi">' + VN[k] + ' ' + val + '</span>';
  }
}

// ========== 启动 ==========
chkLoad();
</script>
